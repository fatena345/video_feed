name: tiktok
description: "A TikTok vertical video feed project with Clean Architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # مظهر الشاشات المتجاوبة وقيم الـ AppValues
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.4
  skeletonizer: ^2.1.3
  double_back_to_close_app: ^2.1.0
  json_annotation: ^4.9.0

  # نظام التوجيه الآمن نوعياً
  go_router: ^16.0.0


  # الاتصال بالإنترنت والـ API
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.2

  # الأمان وقراءة مفاتيح البيئة المتغيرة (.env)
  flutter_dotenv: ^5.2.1

  # الهيكلية النظيفة وحقن الكلاسات البرمجية آلياً
  get_it: ^9.2.1
  injectable: ^3.0.0
  dartz: ^0.10.1
  equatable: ^2.0.8
  package_info_plus: ^9.0.1

  # إدارة الحالة (BLoC Pattern)
  flutter_bloc: ^9.1.1

  # مشغل الفيديوهات وعملية الـ pre-caching لتقليل الذاكرة
  video_player: ^2.10.1
  cached_video_player_plus: ^4.1.0 # الإصدار الأحدث المستقر والمدعوم
  flutter_cache_manager: ^3.4.1
  visibility_detector: ^0.4.0+2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  
  # أدوات ومولدات الكود التلقائية (Generators)
  build_runner: ^2.4.15
  json_serializable: ^6.9.0
  injectable_generator: ^3.0.2
  go_router_builder: ^4.4.0 # الأداة الضرورية لبناء app_routes.g.dart

flutter:
  uses-material-design: true

  # أضف هنا أصول الصور والخطوط المخصصة للتطبيق إذا لزم الأمر
  assets:
    - key.env

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
